<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>To-Do List</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar app-nav">
        <div class="container">
            <span class="navbar-brand mb-0">Taskboard</span>
        </div>
    </nav>

    <main class="container py-4">
        <div class="row justify-content-center">
            <div class="col-12 col-md-9 col-lg-7">

                <h1 class="page-title">My tasks</h1>

                <div class="input-group mb-1">
                    <input type="text" id="taskInput" class="form-control form-control-lg"
                    placeholder="What needs doing?" aria-label="New task">
                    <button class="btn btn-add btn-lg" id="addBtn" type="button">Add Task</button>
                </div>
                <div id="errorMsg" class="error-msg"></div>

                <div class="d-flex flex-wrap gap-2 justify-content-between align-items-center my-3">
                    <div class="btn-group" role="group" aria-label="Filter tasks">
                        <button type="button" class="btn btn-filter active" data-filter="all">All</button>
                        <button type="button" class="btn btn-filter" data-filter="active">Active</button>
                        <button type="button" class="btn btn-filter" data-filter="completed">Completed</button>
                    </div>
                    <span id="counter" class="counter">0 tasks left</span>
                </div>

                <ul id="taskList" class="list-group task-list"></ul>

                <div class="text-end mt-3">
                    <button id="clearBtn" class="btn btn-sm btn-outline-clear" type="button">Clear Completed</button>
                </div>

            </div>
        </div>
    </main>
  

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
